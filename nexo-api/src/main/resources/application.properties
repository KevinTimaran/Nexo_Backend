spring.application.name=nexo-api

# Render injects PORT; 8080 locally.
server.port=${PORT:8080}

# Authentication (Supabase Auth). Secure by default: set SUPABASE_JWKS_URI, e.g.
#   https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
# Legacy projects that sign with a shared secret can set SUPABASE_JWT_SECRET instead.
nexo.auth.jwks-uri=${SUPABASE_JWKS_URI:}
nexo.auth.issuer=${SUPABASE_JWT_ISSUER:}
nexo.auth.hs256-secret=${SUPABASE_JWT_SECRET:}
# Local development only: true disables authentication and everything runs as one local user.
nexo.auth.disabled=${NEXO_AUTH_DISABLED:false}

# Browser origins allowed to call the API (comma separated): the web site, the dev server and the desktop app.
nexo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost}
