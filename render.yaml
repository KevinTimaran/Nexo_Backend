# Render Blueprint for the Nexo API. Secrets are NOT stored here: fill them in the Render dashboard.
services:
  - type: web
    name: nexo-api
    runtime: docker
    rootDir: nexo-api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Supabase Postgres, "Session pooler" URI (postgresql://postgres.<ref>:<password>@<host>:5432/postgres).
      - key: NEXO_DB_URL
        sync: false
      # https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_JWKS_URI
        sync: false
      # Optional: https://<project-ref>.supabase.co/auth/v1
      - key: SUPABASE_JWT_ISSUER
        sync: false
      # Browser origins allowed to call the API, comma separated: the static site URL plus the desktop app origins.
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexo-web.onrender.com,http://tauri.localhost,https://tauri.localhost,tauri://localhost
      # Supabase user id (UUID) that adopts projects created before accounts existed. Optional.
      - key: NEXO_LEGACY_OWNER_ID
        sync: false
